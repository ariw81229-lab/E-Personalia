<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoring Karyawan</title>
<meta name="description" content="Monitoring data SDM: karyawan, cuti, kuota, slip gaji, dan laporan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16302b;--ink-2:#4b625c;--ink-3:#6c817b;--bg:#eef3f1;--paper:#fff;--line:#d6e0dc;--line-2:#e8eeeb;
  --jade:#0f6b5c;--jade-d:#0a5346;--jade-l:#dcefe9;--pine:#123a32;--pine-2:#1c4b41;
  --marigold:#d9930d;--marigold-l:#fdf1d7;--marigold-d:#8a5c00;--rose:#b83a4b;--rose-l:#fbe7ea;--sky-l:#e2edf7;--sky-d:#265c8c;
  --r:10px;--font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--display:"Sora","Plus Jakarta Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
h1{font-family:var(--display);font-size:26px;line-height:1.25;font-weight:600;letter-spacing:-.02em}
h2{font-family:var(--display);font-size:16px;line-height:1.35;font-weight:600;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--jade)}
:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.muted{color:var(--ink-2)}.small{font-size:13px}.nowrap{white-space:nowrap}.right{text-align:right}

/* Tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--jade);color:var(--jade)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.primary:hover{background:var(--jade-d);color:#fff}
.btn.danger{color:var(--rose);border-color:#e7c3c9}
.btn.danger:hover{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg,.nav svg,.icon-btn svg{flex:none}

/* Tata letak utama */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{background:var(--pine);color:rgba(255,255,255,.92);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:40}
.brand{display:flex;gap:11px;align-items:center;padding:20px 18px 16px}
.brand img{width:40px;height:40px;border-radius:9px;background:#fff;object-fit:contain}
.brand b{display:block;font-family:var(--display);font-size:18px;font-weight:600;line-height:1.25;letter-spacing:-.01em;color:#fff}
.brand span{font-size:12px;color:rgba(255,255,255,.68)}
.logos{display:flex;gap:6px;flex:none}
.brand.multi{flex-direction:column;align-items:flex-start}
.nav{padding:4px 10px 16px;flex:1}
.grp{margin-bottom:2px}
.grp-h{width:100%;display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 10px;background:none;border:0;border-radius:8px;color:rgba(255,255,255,.92);font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.grp-h:hover{background:var(--pine-2)}
.grp-h .lbl{flex:1}
.grp-h .chev{transition:transform .18s}
.grp-h[aria-expanded=true] .chev{transform:rotate(180deg)}
.subs{display:grid;grid-template-rows:0fr;transition:grid-template-rows .18s}
.grp.open .subs{grid-template-rows:1fr}
.subs>div{overflow:hidden;visibility:hidden}
.grp.open .subs>div{visibility:visible}
.sub{display:block;margin:1px 0 1px 28px;padding:8px 10px;border-radius:7px;border-left:2px solid transparent;color:rgba(255,255,255,.76);text-decoration:none;font-size:14px}
.sub:hover{background:var(--pine-2);color:#fff}
.sub.on{background:var(--pine-2);color:#fff;font-weight:700;border-left-color:var(--marigold)}
.me{border-top:1px solid var(--pine-2);padding:14px 16px;font-size:13px}
.me b{display:block;color:#fff;overflow-wrap:anywhere}
.me span{color:rgba(255,255,255,.68)}
.me button{margin-top:7px;width:100%;background:none;color:rgba(255,255,255,.92);border-color:rgba(255,255,255,.28)}
.me button:hover{color:#fff;border-color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;min-height:60px;padding:10px 32px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar .ttl{display:none;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.topbar .nav-btn{display:none}
.crumb{font-size:14px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--ink);font-weight:600}
.topbar .sp{flex:1}
.theme-btn .sw{display:flex}
.theme-btn .sw i,.theme .sw i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;margin-left:-6px;display:block}
.theme-btn .sw i:first-child{margin-left:0}
.dd.theme-dd .menu{left:auto;right:0;width:min(380px,calc(100vw - 24px));max-height:min(72vh,560px);overflow:auto;padding:12px}
.theme-dd .themes{grid-template-columns:1fr 1fr;gap:7px}
.tm-h{font-family:var(--display);font-weight:600;font-size:15px;margin:0 2px 10px}
.dd.theme-dd .menu button.theme{display:flex;align-items:center;gap:9px;padding:8px 9px;font-size:13.5px;border:1.5px solid var(--line);border-radius:8px}
.dd.theme-dd .menu button.theme[aria-pressed=true]{border-color:var(--jade);background:var(--jade-l)}
.topbar .menu{color:var(--ink)}
.icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:none;color:inherit;cursor:pointer}
.scrim{display:none}
.content{padding:28px 32px 48px;max-width:1360px;width:100%;margin:0 auto}
.demo-note{background:var(--marigold-l);color:var(--marigold-d);padding:8px 32px;font-size:13px;font-weight:600}
.page-h{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
.page-h p{color:var(--ink-2);max-width:68ch;margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px}

/* Dropdown tombol */
.dd{position:relative}
.dd .chev{transition:transform .15s}
.dd.open .chev{transform:rotate(180deg)}
.menu{display:none;position:absolute;right:0;top:calc(100% + 5px);min-width:190px;background:var(--paper);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 24px rgba(18,58,50,.16);padding:5px;z-index:20}
.dd.open .menu{display:block}
.menu button{display:block;width:100%;padding:9px 11px;border:0;background:none;text-align:left;border-radius:6px;cursor:pointer;font-size:14px;font-weight:500}
.menu button:hover{background:var(--jade-l)}

/* Panel & tabel */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.panel-b{padding:16px 18px}
.filters{display:flex;flex-wrap:wrap;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2);align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.fld.grow{flex:1 1 220px}
input,select,textarea{min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;width:100%;font-size:15px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--jade);outline-offset:-1px;border-color:var(--jade)}
.t-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:13px;font-weight:700;color:var(--ink-2);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#f7faf9}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f7faf9}
td.num,th.num{text-align:right}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.name{font-weight:700}
.sub-t{display:block;font-size:13px;color:var(--ink-2)}
.empty{padding:44px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:3px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 18px;border-top:1px solid var(--line-2);font-size:13px;color:var(--ink-2)}
.pager div{display:flex;gap:6px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--line-2);color:var(--ink-2)}
.badge.ok{background:var(--jade-l);color:var(--jade-d)}
.badge.wait{background:var(--marigold-l);color:var(--marigold-d)}
.badge.no{background:var(--rose-l);color:var(--rose)}
.badge.info{background:var(--sky-l);color:var(--sky-d)}

/* Kartu kuota model kartu absen */
.punch{display:inline-grid;grid-template-columns:repeat(12,15px);gap:4px;vertical-align:middle}
.punch i{width:15px;height:15px;border-radius:50%;background:#fff;border:1.5px solid #a9bdb6;display:block}
.punch i.used{background:var(--jade);border-color:var(--jade)}
.punch i.wait{border-color:var(--marigold);background:repeating-linear-gradient(135deg,var(--marigold) 0 2px,#fff 2px 4px)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .punch{grid-template-columns:15px}
.sisa{font-family:var(--display);font-size:20px;font-weight:600}
.sisa.low{color:var(--rose)}

/* Dashboard */
.today{display:grid;grid-template-columns:repeat(5,1fr);background:var(--pine);border-radius:var(--r);color:#fff;margin-bottom:18px;overflow:hidden}
.today a{display:block;padding:18px 20px;color:inherit;text-decoration:none;border-right:1px solid var(--pine-2)}
.today a:last-child{border:0}
.today a:hover{background:var(--pine-2)}
.today b{display:block;font-family:var(--display);font-size:32px;line-height:1.15;font-weight:600;letter-spacing:-.02em}
.today span{font-size:13px;color:rgba(255,255,255,.76)}
.today .hot b{color:#f7c35b}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.row-i{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line-2)}
.row-i:last-child{border:0}
.chart{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:22px}
.bar-c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;position:relative;min-width:0}
.bar-c u{text-decoration:none;font-size:12px;font-weight:700}
.bar{width:min(100%,30px);background:var(--jade);border-radius:4px 4px 0 0;min-height:2px}
.bar-c.now .bar{background:var(--marigold)}
.bar-c small{font-size:12px;color:var(--ink-2)}
.hbar{display:grid;grid-template-columns:minmax(90px,130px) 1fr 34px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.hbar div{background:var(--line-2);border-radius:4px;height:12px}
.hbar i{display:block;height:100%;background:var(--jade);border-radius:4px}
.hbar b{text-align:right}

/* Modal */
dialog{border:0;border-radius:12px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);color:var(--ink);box-shadow:0 24px 60px rgba(10,40,34,.3)}
dialog.wide{width:min(900px,calc(100vw - 24px))}
.sign-box{border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin-bottom:14px}
.sign-box summary{cursor:pointer;font-weight:700}
.sign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.sign-slot{display:grid;gap:5px}.sign-slot b{font-size:13px}
.sign-slot input{min-height:36px;padding:6px 9px;font-size:14px}
.form-prev{width:100%;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff}
.form-prev iframe{width:794px;height:1119px;border:0;transform-origin:0 0;display:block}
dialog::backdrop{background:rgba(14,40,34,.55)}
.m-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:#fff;z-index:2}
.m-h h2{font-size:18px}
.m-b{padding:18px 20px}
.m-f{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line-2);position:sticky;bottom:0;background:#fff}
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form .full{grid-column:1/-1}
.help{font-weight:400;font-size:12.5px;color:var(--ink-3)}
.err{background:var(--rose-l);color:var(--rose);padding:9px 12px;border-radius:7px;font-size:14px;font-weight:600;margin-bottom:12px}
.req{color:var(--rose)}
.check-list{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.check-list label{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line-2);cursor:pointer}
.check-list input{width:18px;min-height:18px;flex:none}

/* Slip */
.slip-head{display:flex;gap:12px;align-items:center;padding-bottom:12px;border-bottom:2px solid var(--ink);margin-bottom:12px}
.slip-head img{width:48px;height:48px;object-fit:contain}
.slip-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:14px;margin-bottom:14px}
.slip-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.slip-cols h3{font-size:14px;margin-bottom:5px}
.slip-l{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px;border-bottom:1px dotted var(--line)}
.slip-l.t{font-weight:700;border-bottom:0}
.kblk{margin:6px 0 10px}.kblk>b{display:block;font-size:13px;color:var(--jade-d);margin-bottom:2px}
.calc{background:var(--jade-l);border-radius:9px;padding:12px 14px}
.calc .slip-l{border-bottom-color:rgba(0,0,0,.08)}
.slip-net{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;padding:12px 14px;background:var(--jade-l);border-radius:8px;font-weight:700}
.slip-net b{font-size:21px;font-weight:800}

/* Impor */
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.seg button{padding:8px 14px;min-height:40px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.step:last-child{border:0}
.step>b{width:30px;height:30px;border-radius:50%;background:var(--jade);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.step p{margin:2px 0 10px;color:var(--ink-2)}
.drop{display:block;border:2px dashed #a9bdb6;border-radius:9px;padding:20px;text-align:center;cursor:pointer;background:#f7faf9}
.drop:hover,.drop.over{border-color:var(--jade);background:var(--jade-l)}
.drop input{position:absolute;width:1px;height:1px;min-height:0;padding:0;opacity:0}
.sample{font-size:13px}.sample th,.sample td{padding:7px 10px;white-space:nowrap}

/* Masuk */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--pine)}
.login-art{color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.login-art h1{font-size:clamp(30px,3.3vw,46px);max-width:15em;line-height:1.14;letter-spacing:.005em;margin-top:40px}
.login-art p{font-size:clamp(16px,1.35vw,19px);line-height:1.6;max-width:32em;margin-top:18px;color:rgba(255,255,255,.82)}
.login-art .brand b{font-size:clamp(21px,2vw,28px)}
.login-art .brand{padding:0}
.login-art .brand img{width:52px;height:52px}
.big-punch{display:grid;grid-template-columns:repeat(12,minmax(0,34px));gap:10px}
.big-punch i{aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.3)}
.big-punch i.f{background:var(--marigold);border-color:var(--marigold)}
.login-box{background:var(--bg);display:flex;align-items:center;justify-content:center;padding:32px 20px}
.login-card{width:min(420px,100%)}
.login-card h2{font-size:24px;margin-bottom:4px}
.login-card form{display:grid;gap:13px;margin-top:18px}
.link{background:none;border:0;padding:0;color:var(--jade);font-weight:600;cursor:pointer;font-size:14px;text-decoration:underline}
.demo-b{display:grid;gap:9px;margin-top:18px}
.demo-b button{display:block;text-align:left;padding:13px 15px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer}
.demo-b button:hover{border-color:var(--jade)}
.demo-b b{display:block}.demo-b span{font-size:13px;color:var(--ink-2)}
details.setup{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:0 14px;font-size:14px}
details.setup summary{cursor:pointer;font-weight:700;padding:12px 0}
details.setup ol{padding-left:20px;margin:0 0 12px}
details.setup li{margin-bottom:6px}

.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px}
.theme{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-weight:600;font-size:14px;text-align:left}
.theme:hover{border-color:var(--jade)}
.theme[aria-pressed=true]{border-color:var(--jade);background:var(--jade-l)}
.theme .sw{display:flex;flex:none}
.theme .sw i{width:18px;height:18px;border-radius:50%;border:2px solid #fff;margin-left:-6px}
.theme .sw i:first-child{margin-left:0}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:100;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:#fff;padding:11px 15px;border-radius:9px;font-weight:600;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.bad{background:var(--rose)}
.loading{padding:64px;text-align:center;color:var(--ink-2)}

@media (max-width:1100px){.today{grid-template-columns:repeat(3,1fr)}.today a{border-bottom:1px solid var(--pine-2)}}
@media (max-width:980px){
  .shell{display:block}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,84vw);transform:translateX(-100%);transition:transform .2s}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(14,40,34,.5);z-index:35}
  .topbar{background:var(--pine);color:#fff;border:0;padding:8px 12px;min-height:56px}
  .topbar .ttl,.topbar .nav-btn{display:inline-flex}
  .crumb{display:none}
  .theme-btn{background:none;border-color:rgba(255,255,255,.35);color:#fff;padding:6px 10px}
  .theme-btn:hover{color:#fff;border-color:#fff}
  .theme-btn .tlbl{display:none}
  .content{padding:20px 16px 40px}.demo-note{padding:8px 16px}
  .login{grid-template-columns:1fr}.login-art{padding:28px 20px;gap:12px}.login-art h1{margin-top:16px;font-size:24px}.login-art p{margin-top:10px}.big-punch{display:none}
}
@media (max-width:720px){
  h1{font-size:22px}
  .grid2{grid-template-columns:1fr}
  .today{grid-template-columns:repeat(2,1fr)}
  .today b{font-size:28px}
  .tools,.tools>.btn,.tools>.dd{flex:1 1 auto}
  .tools .btn{width:100%}
  .dd .menu{left:0;right:auto}
  .fld{flex:1 1 44%}.fld.grow{flex:1 1 100%}
  table.cards thead{display:none}
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
  table.cards tr{padding:10px 16px;border-bottom:1px solid var(--line)}
  table.cards tr:last-child{border:0}
  table.cards td{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border:0;text-align:right}

create function public.my_role() returns text language sql stable security definer set search_path=public as
$$ select role from profil where id=auth.uid() $$;

create function public.my_karyawan() returns uuid language sql stable security definer set search_path=public as
$$ select k.id from karyawan k join profil p on lower(k.email)=lower(p.email) where p.id=auth.uid() limit 1 $$;

-- Akun baru: menjadi karyawan bila email-nya terdaftar, selain itu menunggu admin.
create function public.akun_baru() returns trigger language plpgsql security definer set search_path=public as $$
begin
  insert into profil(id,email,nama,role) values(
    new.id,new.email,coalesce(new.raw_user_meta_data->>'nama',''),
    case when exists(select 1 from karyawan where lower(email)=lower(new.email)) then 'karyawan' else 'pending' end);
  return new;
end $$;
create trigger hr_monitoring_akun_baru after insert on auth.users for each row execute function public.akun_baru();

-- Menyelaraskan akun dan mencatat penambahan/penghapusan karyawan.
create function public.karyawan_setelah() returns trigger language plpgsql security definer set search_path=public as $$
declare siapa text := coalesce((select email from profil where id=auth.uid()),'sistem');
begin
  if tg_op='DELETE' then
    update profil set role='pending' where role='karyawan' and lower(email)=lower(old.email);
    insert into log_aktivitas(pelaku,aksi,detail) values(siapa,'Hapus karyawan',old.nik||' - '||old.nama);
    return old;
  end if;
  if tg_op='UPDATE' and old.email is distinct from new.email and old.email is not null then
    update profil set role='pending' where role='karyawan' and lower(email)=lower(old.email);
  end if;
  update profil set role='karyawan' where role='pending' and lower(email)=lower(new.email);
  if tg_op='INSERT' then
    insert into log_aktivitas(pelaku,aksi,detail) values(siapa,'Tambah karyawan',new.nik||' - '||new.nama);
  end if;
  return new;
end $$;
create trigger karyawan_setelah after insert or update or delete on public.karyawan for each row execute function public.karyawan_setelah();

-- Hari cuti dihitung di server (Senin-Jumat) dan kuota diperiksa di server.
create function public.cuti_sebelum() returns trigger language plpgsql security definer set search_path=public as $$
declare kuota int; terpakai int;
begin
  if new.selesai<new.mulai then raise exception 'Tanggal selesai tidak boleh sebelum tanggal mulai.'; end if;
  select count(*) into new.hari from generate_series(new.mulai,new.selesai,interval '1 day') d where extract(isodow from d)<6;
  if new.hari=0 then raise exception 'Rentang tanggal hanya berisi akhir pekan.'; end if;
  if new.tgl_berangkat is not null and new.tgl_kembali is not null and new.tgl_kembali<new.tgl_berangkat then raise exception 'Tanggal kepulangan tidak boleh sebelum tanggal keberangkatan.'; end if;
  if coalesce(my_role(),'')<>'admin' then
    new.disetujui_oleh:=''; new.catatan:=''; new.uang_saku:=0;
    if coalesce(new.dokumen_path,'')<>'' and new.dokumen_path not like new.karyawan_id::text||'/%' then raise exception 'Lokasi dokumen tidak valid.'; end if;
  end if;
  if new.status='Ditolak' then return new; end if;
  if exists(select 1 from cuti c where c.karyawan_id=new.karyawan_id and c.status<>'Ditolak'
            and c.id is distinct from new.id and c.mulai<=new.selesai and c.selesai>=new.mulai) then
    raise exception 'Tanggal ini bertabrakan dengan pengajuan lain.';
  end if;
  if new.jenis='Cuti Tahunan' then
    if extract(year from new.mulai)<>extract(year from new.selesai) then
      raise exception 'Cuti Tahunan lintas tahun harus diajukan terpisah per tahun.';
    end if;
    select kuota_cuti into kuota from karyawan where id=new.karyawan_id;
    select coalesce(sum(hari),0) into terpakai from cuti c where c.karyawan_id=new.karyawan_id and c.jenis='Cuti Tahunan'
      and c.status<>'Ditolak' and c.id is distinct from new.id and extract(year from c.mulai)=extract(year from new.mulai);
    terpakai := terpakai + coalesce((select sum(hari) from kompensasi k where k.karyawan_id=new.karyawan_id and k.status<>'Ditolak' and k.tahun=extract(year from new.mulai)),0);
    if terpakai+new.hari>kuota then raise exception 'Sisa kuota Cuti Tahunan tidak cukup (tersisa % hari).',kuota-terpakai; end if;
  end if;
  return new;
end $$;
create trigger cuti_sebelum before insert or update on public.cuti for each row execute function public.cuti_sebelum();

create or replace function public.kompensasi_sebelum() returns trigger language plpgsql security definer set search_path=public as $$
declare kuota int; terpakai int;
begin
  new.nilai_cuti := round(new.gaji/30*new.hari*0.5);
  new.total := new.harga_tiket+new.nilai_cuti;
  if new.status='Ditolak' then return new; end if;
  select kuota_cuti into kuota from karyawan where id=new.karyawan_id;
  select coalesce(sum(hari),0) into terpakai from cuti c where c.karyawan_id=new.karyawan_id and c.jenis='Cuti Tahunan' and c.status<>'Ditolak' and extract(year from c.mulai)=new.tahun;
  terpakai := terpakai + coalesce((select sum(hari) from kompensasi k where k.karyawan_id=new.karyawan_id and k.status<>'Ditolak' and k.tahun=new.tahun and k.id is distinct from new.id),0);
  if terpakai+new.hari>kuota then raise exception 'Sisa kuota cuti tahun % tidak cukup untuk kompensasi (tersisa % hari).',new.tahun,kuota-terpakai; end if;
  return new;
end $$;

function checkKomp(r,ignoreId){

function checkCuti(r,ignoreId){
  if(r.selesai<r.mulai) return 'Tanggal selesai tidak boleh sebelum tanggal mulai.';
  if(r.tgl_berangkat&&r.tgl_kembali&&r.tgl_kembali<r.tgl_berangkat) return 'Tanggal kepulangan tidak boleh sebelum tanggal keberangkatan.';
  const hari=workdays(r.mulai,r.selesai);
  if(!hari) return 'Rentang tanggal hanya berisi akhir pekan.';
  if(r.status==='Ditolak') return '';
  const lain=S.d.cuti.filter(c=>c.karyawan_id===r.karyawan_id&&c.status!=='Ditolak'&&c.id!==ignoreId);
  if(lain.some(c=>c.mulai<=r.selesai&&c.selesai>=r.mulai)) return 'Tanggal ini bertabrakan dengan pengajuan lain.';
  if(r.jenis==='Cuti Tahunan'){
    if(r.mulai.slice(0,4)!==r.selesai.slice(0,4)) return 'Cuti Tahunan lintas tahun harus diajukan terpisah per tahun.';
    const k=S.d.karyawan.find(x=>x.id===r.karyawan_id); if(!k) return '';
    const used=lain.filter(c=>c.jenis==='Cuti Tahunan'&&c.mulai.slice(0,4)===r.mulai.slice(0,4)).reduce((a,c)=>a+num(c.hari),0)+(S.d.kompensasi||[]).filter(c=>c.karyawan_id===r.karyawan_id&&c.status!=='Ditolak'&&String(c.tahun)===r.mulai.slice(0,4)).reduce((a,c)=>a+num(c.hari),0);
    if(used+hari>num(k.kuota_cuti)) return `Sisa kuota Cuti Tahunan tidak cukup (tersisa ${num(k.kuota_cuti)-used} hari).`;
  }
  return '';
}

let CUR=null;
function initF(p,id){if(!F[id]){F[id]={q:'',page:1};(p.filters||[]).forEach(x=>F[id][x.id]=x.def||'');}return F[id];}
function filtered(p,id){const f=F[id];let rows=p.rows(f);const q=f.q.trim().toLowerCase();
  if(q){const cs=p.cols.filter(c=>c.only!=='s');rows=rows.filter(r=>cs.some(c=>String(c.v(r)??'').toLowerCase().includes(q)));}return rows;}
function dlMenu(){return `<div class="dd"><button class="btn" data-act="dd" aria-haspopup="true" aria-expanded="false">Unduh ${chev}</button><div class="menu"><button data-act="exp" data-f="xlsx">Unduh Excel (.xlsx)</button><button data-act="exp" data-f="pdf">Unduh PDF (.pdf)</button></div></div>`;}
function renderList(id){
  const p=PAGES[id]();CUR={id,p};const f=initF(p,id);
  $('#view').innerHTML=`<div class="page-h"><div><h1>${esc(p.title)}</h1><p>${esc(p.desc||'')}</p></div><div class="tools">${p.tools?p.tools():''}${p.noExport?'':dlMenu()}${p.addAct?`<button class="btn primary" data-act="${p.addAct}">${esc(p.addLabel)}</button>`:''}</div></div>
  <div class="panel"><div class="filters"><label class="fld grow">Cari<input type="search" id="q" value="${esc(f.q)}" placeholder="Ketik untuk mencari…"></label>
  ${(p.filters||[]).map(x=>{const opts=x.opts().map(o=>typeof o==='object'?o:{v:o,t:o});return `<label class="fld">${esc(x.label)}<select data-filter="${x.id}">${x.all?`<option value="">${x.all}</option>`:''}${opts.map(o=>`<option value="${esc(o.v)}" ${String(f[x.id])===String(o.v)?'selected':''}>${esc(o.t)}</option>`).join('')}</select></label>`;}).join('')}</div>
  ${p.legend?`<div class="panel-b" style="padding-bottom:0"><div class="legend"><span><span class="punch"><i class="used"></i></span>Terpakai</span><span><span class="punch"><i class="wait"></i></span>Menunggu persetujuan</span><span><span class="punch"><i></i></span>Tersisa</span></div></div>`:''}
  <div id="tbl"></div></div>`;
  drawTable();
}
function drawTable(){
  const {id,p}=CUR,f=F[id],all=filtered(p,id),size=25,pages=Math.max(1,Math.ceil(all.length/size));
  f.page=Math.min(f.page,pages);const rows=all.slice((f.page-1)*size,f.page*size);
  const cols=p.cols.filter(c=>c.only!=='x');
  if(!all.length){$('#tbl').innerHTML=`<div class="empty"><b>Belum ada data yang cocok</b>${p.addAct?'Tambahkan data baru atau ubah filter.':'Ubah filter atau kata pencarian.'}</div>`;return;}
  const nc=c=>c.t==='money'||c.t==='num'?'num':'';
  const body=rows.map(r=>`<tr>${cols.map(c=>`<td class="${nc(c)}" data-l="${esc(c.l)}"><span>${c.h?c.h(r):esc(c.t==='date'?fmtDate(c.v(r)):c.t==='money'?rupiah(c.v(r)):c.v(r))}</span></td>`).join('')}${p.acts?`<td class="acts-c"><div class="acts">${p.acts(r)}</div></td>`:''}</tr>`).join('');
  $('#tbl').innerHTML=`<div class="t-wrap"><table class="cards"><thead><tr>${cols.map(c=>`<th class="${nc(c)}">${esc(c.l)}</th>`).join('')}${p.acts?'<th class="right">Aksi</th>':''}</tr></thead><tbody>${body}</tbody></table></div>
  <div class="pager"><span>${all.length} baris</span>${pages>1?`<div><button class="btn sm" data-act="pg" data-d="-1" ${f.page<=1?'disabled':''}>Sebelumnya</button><span style="align-self:center">${f.page} / ${pages}</span><button class="btn sm" data-act="pg" data-d="1" ${f.page>=pages?'disabled':''}>Berikutnya</button></div>`:''}</div>`;
}
function exportDef(id){
  const p=PAGES[id]();const f=initF(p,id);
  const parts=(p.filters||[]).filter(x=>f[x.id]).filter(x=>!(p.xTitle&&(x.id==='y'||x.id==='p'))).map(x=>{const o=x.opts().map(o=>typeof o==='object'?o:{v:o,t:o}).find(o=>String(o.v)===String(f[x.id]));return `${x.label}: ${o?o.t:f[x.id]}`;});
  if(f.q.trim())parts.push(`Pencarian: ${f.q.trim()}`);
  return {title:p.xTitle?p.xTitle(f):p.title,subtitle:parts.join(', '),cols:p.xCols?p.xCols():p.cols.filter(c=>c.only!=='s'),rows:filtered(p,id),total:p.total,style:p.xStyle,pdf:p.xPdf};
}
async function doExport(id,fmt){
  try{const d=exportDef(id);if(!d.rows.length){toast('Tidak ada data untuk diunduh pada filter ini.',1);return;}
    if(fmt==='xlsx')await exportExcel(d);else exportPdf(d.pdf?{...d,...d.pdf(d.rows)}:d);toast(`${d.title} berhasil diunduh.`);}catch(e){console.error(e);toast(friendly(e),1);}
}

  else if(m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/))[d,mo,y]=[+m[1],+m[2],+m[3]];

async function saveCuti(v,existing){
  const file=v.dokumen;delete v.dokumen;
  ['tgl_berangkat','tgl_kembali'].forEach(k=>{if(k in v)v[k]=v[k]||null;});
  const id=existing?existing.id:uid(),row={...v};let path='';
  if(file&&file.size){
    if(file.size>5242880)throw new Error('Ukuran dokumen maksimal 5 MB.');
    if(!/\.(pdf|jpe?g|png)$/i.test(file.name))throw new Error('Dokumen harus berformat PDF, JPG, atau PNG.');
    path=`${row.karyawan_id||existing.karyawan_id}/${id}/${Date.now()}-${safeName(file.name)}`;
    await Api.uploadDok(path,file);row.dokumen_path=path;row.dokumen_nama=file.name;
  }
  try{ if(existing)await Api.update('cuti',[id],row);else await Api.insert('cuti',[{id,...row}]); }
  catch(e){if(path)await Api.removeDok(path);throw e;}
  if(path&&existing&&existing.dokumen_path)await Api.removeDok(existing.dokumen_path);
}

  'tarif-add'(){formModal({title:'Tambah tarif tiket',fields:tarifFields(),onSubmit:async v=>{await Api.insert('tarif_tiket',[{...v,tujuan:v.tujuan.trim()}]);return 'Tarif ditambahkan.';}});},
  'tarif-edit'(el){const r=find('tarif_tiket',el.dataset.id);formModal({title:'Ubah tarif tiket',fields:tarifFields(),values:r,onSubmit:async v=>{await Api.update('tarif_tiket',[r.id],{...v,tujuan:v.tujuan.trim()});return 'Tarif diperbarui.';}});},
  'tarif-del'(el){confirmModal('Hapus tarif','Tarif ini akan dihapus. Kompensasi yang sudah tercatat tidak berubah.','Hapus tarif',async()=>{await Api.remove('tarif_tiket',el.dataset.id);return 'Tarif dihapus.';});},
  'role-set'(el){const r=find('profil',el.dataset.id);formModal({title:'Ubah peran',intro:r.email,fields:[{k:'role',l:'Peran',type:'select',full:1,opts:Object.entries(ROLE_LABEL).map(([v,t])=>({v,t}))}],values:r,onSubmit:async v=>{await Api.update('profil',[r.id],{role:v.role});return 'Peran diperbarui.';}});},
  'theme-set'(el){themeNow=applyTheme(el.dataset.id);try{localStorage.setItem('hr_tema',themeNow);}catch(e){}$$('.theme').forEach(b=>b.setAttribute('aria-pressed',b===el));const sw=$('.theme-btn .sw');if(sw)sw.innerHTML=swatch(THEMES.find(t=>t.id===themeNow));},
  'pw-change'(){formModal({title:'Ubah kata sandi',fields:[{k:'password',l:'Kata sandi baru',type:'password',req:1,full:1,help:'Minimal 8 karakter.'}],submit:'Simpan kata sandi',onSubmit:async v=>{if(v.password.length<8)throw new Error('Kata sandi minimal 8 karakter.');await Api.updatePw(v.password);return 'Kata sandi diperbarui.';}});},
  'logo-reset':async el=>{try{const k=el.dataset.k;await Api.saveSettings({[k]:''});S.settings[k]='';render();toast('Logo dihapus.');}catch(e){toast(friendly(e),1);}}
};
function closeDd(){$$('.dd.open').forEach(d=>{d.classList.remove('open');$('[data-act=dd]',d).setAttribute('aria-expanded','false');});}

function renderPerusahaan(){
  const s=S.settings;
  $('#view').innerHTML=`<div class="page-h"><div><h1>Perusahaan & Logo</h1><p>Nama dan logo ini tampil di aplikasi serta semua hasil unduhan Excel dan PDF.</p></div></div>
  <div class="grid2"><section class="panel"><div class="panel-h"><h2>Profil perusahaan</h2></div><div class="panel-b"><form id="set-f" class="form"><label class="fld full">Nama perusahaan<input name="perusahaan" required value="${esc(s.perusahaan)}"></label><label class="fld full">Nama proyek<input name="nama_proyek" value="${esc(s.nama_proyek||'')}" placeholder="Contoh: Proyek Dusem Segmen - 1"><span class="help">Tampil di bawah nama perusahaan pada form cuti.</span></label><label class="fld full">Alamat<input name="alamat" value="${esc(s.alamat||'')}"></label><label class="fld full">Kuota cuti standar untuk karyawan baru<input name="kuota_default" type="number" min="0" step="1" required value="${esc(s.kuota_default)}"></label><div class="full"><button class="btn primary">Simpan perubahan</button></div></form></div></section>
  <section class="panel"><div class="panel-h"><h2>Logo</h2></div><div class="panel-b" style="display:grid;gap:14px">${LOGO_SLOTS.map(([k,l])=>`<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="width:72px;height:72px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:12px;flex:none">${s[k]?`<img src="${s[k]}" alt="${l}" style="width:64px;height:64px;object-fit:contain">`:'Kosong'}</div><div><b>${l}</b><div class="tools" style="margin-top:5px"><label class="btn sm primary">Unggah<input type="file" class="logo-f" data-k="${k}" accept="image/png,image/jpeg,image/webp" style="display:none"></label>${s[k]?`<button class="btn sm" data-act="logo-reset" data-k="${k}">Hapus</button>`:''}</div></div></div>`).join('')}<p class="muted small">PNG atau JPG, disarankan persegi. Logo yang diunggah tampil berurutan di aplikasi dan hasil unduhan.</p></div></section></div>`;
  $('#set-f').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries());v.kuota_default=+v.kuota_default;try{await Api.saveSettings(v);Object.assign(S.settings,v);render();toast('Profil perusahaan disimpan.');}catch(x){toast(friendly(x),1);}};
  $$('.logo-f').forEach(inp=>inp.onchange=async e=>{const f=e.target.files[0],k=e.target.dataset.k;if(!f)return;try{const url=await normLogo(f);await Api.saveSettings({[k]:url});S.settings[k]=url;render();toast('Logo disimpan.');}catch(x){toast(friendly(x),1);}});
}
function normLogo(file){return new Promise((res,rej)=>{if(file.size>5e6)return rej(new Error('Ukuran logo maksimal 5 MB.'));const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const r=Math.min(240/i.width,240/i.height),w=i.width*r,h=i.height*r;c.getContext('2d').drawImage(i,(240-w)/2,(240-h)/2,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/png'));};i.onerror=()=>rej(new Error('File logo tidak dapat dibaca.'));i.src=u;});}

/* ---------- Kerangka ---------- */
const CUSTOM={ringkasan:renderRingkasan,beranda:renderBeranda,'kuota-saya':renderKuotaSaya,impor:renderImpor,perusahaan:renderPerusahaan};
const routesFor=role=>NAV[role].flatMap(g=>g.items.map(i=>i[0]));
function render(){
  if(!S.user)return renderLogin();
  const role=S.user.role;
  if(role==='pending'){$('#app').innerHTML=`<div class="login-box" style="min-height:100vh"><div class="login-card panel panel-b"><h2>Akun menunggu akses</h2><p class="muted" style="margin:8px 0 16px">Email ${esc(S.user.email)} belum terhubung dengan data karyawan. Minta Admin Personalia menambahkan email ini atau memberikan peran.</p><button class="btn" data-act="logout">Keluar</button></div></div>`;return;}
  const rs=routesFor(role);let r=(location.hash||'').replace(/^#\/?/,'');if(!rs.includes(r))r=rs[0];S.route=r;
  const g=NAV[role].find(x=>x.items.some(i=>i[0]===r));S.open.add(g.g);
  const portal={admin:'Dashboard Admin Personalia',staff:'Portal Staff Personalia',karyawan:'Portal Karyawan'}[role];
  $('#app').innerHTML=`<div class="shell"><aside class="side" aria-label="Menu utama"><div class="brand ${logos().length>1?'multi':''}">${logoImgs()}<div><b>${esc(S.settings.perusahaan)}</b><span>${portal}</span></div></div>
  <nav class="nav">${NAV[role].map(x=>`<div class="grp ${S.open.has(x.g)?'open':''}" data-g="${esc(x.g)}"><button class="grp-h" data-act="grp" aria-expanded="${S.open.has(x.g)}">${icon(IC[x.i])}<span class="lbl">${esc(x.g)}</span>${chev}</button><div class="subs"><div>${x.items.map(i=>`<a class="sub ${i[0]===r?'on':''}" href="#/${i[0]}" ${i[0]===r?'aria-current="page"':''}>${esc(i[1])}</a>`).join('')}</div></div></div>`).join('')}</nav>
  <div class="me"><b>${esc(S.user.nama||S.user.email)}</b><span>${ROLE_LABEL[role]}</span>${MODE==='cloud'?'<button class="btn sm" data-act="pw-change">Ubah kata sandi</button>':''}<button class="btn sm" data-act="logout">Keluar</button></div></aside>
  <div class="scrim" data-act="nav-close"></div>
  <div class="main"><header class="topbar"><button class="icon-btn nav-btn" data-act="nav-open" aria-label="Buka menu">${icon(IC.menu,22)}</button><b class="ttl">${portal}</b><span class="crumb">${esc(g.g)} <span aria-hidden="true">›</span> <b>${esc(g.items.find(i=>i[0]===r)[1])}</b></span><span class="sp"></span>${themeMenu()}</header>${MODE==='demo'?'<div class="demo-note">Mode demo: data contoh hanya tersimpan di browser ini.</div>':''}<main class="content" id="view"></main></div></div>`;
  document.body.classList.remove('nav-open');
  if(CUSTOM[r])CUSTOM[r]();else renderList(r);
}
async function reload(){
  const d=await Api.loadAll(S.user.role);
  ['karyawan','karyawan_privat','shift','kompensasi','tarif_tiket','cuti','slip_gaji','profil','log_aktivitas'].forEach(t=>S.d[t]=d[t]?[...d[t]]:[]);
  S.privBy=new Map(S.d.karyawan_privat.map(p=>[p.karyawan_id,p]));
  const s=await Api.loadSettings();if(s)S.settings={...S.settings,...s};
}
async function enter(){S.user=await Api.session();if(S.user&&S.user.role!=='pending')await reload();render();}

function loginArt(){let d='';for(let i=0;i<24;i++)d+=`<i class="${[1,2,5,9,10,14,17,20,23].includes(i)?'f':''}"></i>`;
  return `<div class="login-art"><div><div class="brand">${logoImgs()}<div><b>${esc(S.settings.perusahaan)}</b></div></div><h1>SETIAP PROYEK HEBAT DIBANGUN OLEH <span class="nowrap">ORANG-ORANG HEBAT.</span></h1><p>Kelola data karyawan, kontrak, cuti, kompensasi, dan gaji ${esc(S.settings.perusahaan)} dalam satu sistem yang tertata, rapi, dan siap diakses kapan saja.</p></div><div class="big-punch" aria-hidden="true">${d}</div></div>`;}
function renderLogin(){
  let box;
  if(MODE==='demo'){
    box=`<h2>Coba aplikasi</h2><p class="muted">Pilih peran untuk melihat tampilannya.</p>
    <div class="demo-b"><button data-demo="u-admin"><b>Admin Personalia</b><span>Akses penuh ke semua menu</span></button><button data-demo="u-staff"><b>Staff Personalia</b><span>Hanya menambah dan menghapus karyawan</span></button><button data-demo="u-sari"><b>Karyawan</b><span>Cuti, kuota, kontrak, dan slip gaji pribadi</span></button></div>
    <details class="setup"><summary>Cara menghubungkan ke Supabase</summary><ol><li>Buat proyek di Supabase, buka SQL Editor, tempel SQL di bawah, lalu jalankan.</li><li>Di Authentication, pastikan Confirm email aktif. Isi Site URL dengan alamat Vercel Anda.</li><li>Isi <code>SUPABASE_URL</code> dan <code>SUPABASE_ANON_KEY</code> di index.html, unggah ke GitHub, lalu impor repositori ke Vercel.</li><li>Daftar lewat website, lalu jalankan perintah terakhir pada SQL untuk menjadikan akun Anda Admin Personalia.</li></ol><button class="btn sm" id="copy-sql" style="margin-bottom:14px">Salin SQL</button></details>`;
  }else{
    const m=S.authMode;
    box=`<h2>${{masuk:'Masuk',daftar:'Daftar akun',lupa:'Atur ulang kata sandi',ulang:'Kirim ulang konfirmasi'}[m]}</h2><p class="muted">${{masuk:'Gunakan username atau email dan kata sandi Anda.',daftar:'Karyawan memakai email yang terdaftar di Personalia.',lupa:'Tautan pengaturan ulang dikirim ke email Anda.',ulang:'Tautan konfirmasi baru dikirim ke email pendaftaran Anda.'}[m]}</p>
    <form id="auth-f" novalidate><div id="auth-err">${S.authNotice?`<div class="err">${esc(S.authNotice)}</div>`:''}</div>${m==='daftar'?'<label class="fld">Nama lengkap<input name="nama" required autocomplete="name"></label>':''}${m==='masuk'?'<label class="fld">Username atau email<input name="email" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false"></label>':'<label class="fld">Email<input name="email" type="email" required autocomplete="email"></label>'}${m==='masuk'||m==='daftar'?`<label class="fld">Kata sandi<input name="password" type="password" required minlength="8" autocomplete="${m==='masuk'?'current-password':'new-password'}">${m==='daftar'?'<span class="help">Minimal 8 karakter.</span>':''}</label>`:''}<button class="btn primary" type="submit">${{masuk:'Masuk',daftar:'Daftar',lupa:'Kirim tautan',ulang:'Kirim ulang tautan'}[m]}</button></form>
    <p style="margin-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">${m!=='masuk'?'<button class="link" data-auth="masuk">Kembali ke Masuk</button>':'<button class="link" data-auth="daftar">Daftar akun</button><button class="link" data-auth="lupa">Lupa kata sandi?</button><button class="link" data-auth="ulang">Kirim ulang email konfirmasi</button>'}</p>`;
  }
  $('#app').innerHTML=`<div class="login">${loginArt()}<div class="login-box"><div class="login-card">${box}</div></div></div>`;
  const f=$('#auth-f');if(f)f.onsubmit=async e=>{e.preventDefault();const err=$('#auth-err'),say=(m,ok)=>err.innerHTML=`<div class="err" ${ok?'style="background:var(--jade-l);color:var(--jade-d)"':''}>${esc(m)}</div>`;
    if(!f.checkValidity())return say('Lengkapi semua kolom dengan benar. Kata sandi minimal 8 karakter.');
    const v=Object.fromEntries(new FormData(f).entries()),b=$('[type=submit]',f);b.disabled=true;
    try{if(S.authMode==='masuk'){const id=v.email.trim().toLowerCase();await Api.signIn(id.includes('@')?id:`${id}@${USERNAME_DOMAIN}`,v.password);await enter();}
      else if(S.authMode==='daftar'){const live=await Api.signUp(v.email,v.password,v.nama);if(live)await enter();else{say('Periksa email Anda dan buka tautan konfirmasi untuk mengaktifkan akun.',1);b.disabled=false;}}
      else if(S.authMode==='ulang'){await Api.resend(v.email);say('Permintaan diterima. Periksa kotak masuk dan folder spam. Bila akun sudah pernah dikonfirmasi, email tidak dikirim lagi dan Anda bisa langsung masuk.',1);b.disabled=false;}
      else{await Api.resetPw(v.email);say('Tautan terkirim bila email tersebut terdaftar.',1);b.disabled=false;}
    }catch(x){say(friendly(x));b.disabled=false;}};
  const c=$('#copy-sql');if(c)c.onclick=async()=>{try{await navigator.clipboard.writeText($('#schema-sql').textContent.trim());toast('SQL disalin.');}catch(e){toast('Gagal menyalin. Salin dari blok schema-sql di index.html.',1);}};
}

/* ---------- Peristiwa global ---------- */
document.addEventListener('click',async e=>{
  const demo=e.target.closest('[data-demo]');if(demo){await Api.signInDemo(demo.dataset.demo);await enter();return;}
  const au=e.target.closest('[data-auth]');if(au){S.authMode=au.dataset.auth;S.authNotice='';renderLogin();return;}
  if(e.target.closest('.sub'))document.body.classList.remove('nav-open');
  const el=e.target.closest('[data-act]');
  if(!e.target.closest('.dd'))closeDd();
  if(el&&!el.disabled&&ACT[el.dataset.act]){e.preventDefault();ACT[el.dataset.act](el);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDd();document.body.classList.remove('nav-open');}});
document.addEventListener('input',e=>{if(e.target.id==='q'&&CUR){F[CUR.id].q=e.target.value;F[CUR.id].page=1;drawTable();}});
document.addEventListener('change',e=>{
  if(e.target.dataset&&e.target.dataset.filter&&CUR){F[CUR.id][e.target.dataset.filter]=e.target.value;F[CUR.id].page=1;drawTable();}
  if(e.target.id==='imp-file'&&e.target.files[0])handleImportFile(e.target.files[0]);
});
['dragover','dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.toggle('over',t==='dragover');if(t==='drop'&&e.dataTransfer.files[0])handleImportFile(e.dataTransfer.files[0]);}));
window.addEventListener('hashchange',()=>{if(S.user)render();});
document.addEventListener('visibilitychange',async()=>{if(document.hidden||!S.user||S.user.role==='pending'||M().open||MODE==='demo'||S.route==='impor')return;try{await reload();render();}catch(e){}});

(async function boot(){
  try{
    const urlErr=new URLSearchParams(location.hash.slice(1));
    if(urlErr.get('error_code')||urlErr.get('error')){
      const expired=urlErr.get('error_code')==='otp_expired';
      S.authNotice=expired?'Tautan email sudah kedaluwarsa atau sudah pernah dipakai. Kirim tautan baru di bawah ini.':'Tautan email tidak dapat diproses. Kirim tautan baru di bawah ini.';
      S.authMode='ulang';
    }
    if(MODE==='cloud'&&!window.supabase)throw new Error('Pustaka Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.');
    Api=MODE==='cloud'?cloudApi():demoApi();
    if(Api.onRecovery)Api.onRecovery(()=>formModal({title:'Buat kata sandi baru',fields:[{k:'password',l:'Kata sandi baru',type:'password',req:1,full:1,help:'Minimal 8 karakter.'}],onSubmit:async v=>{if(v.password.length<8)throw new Error('Kata sandi minimal 8 karakter.');await Api.updatePw(v.password);await enter();return 'Kata sandi diperbarui.';}}));
    const s=await Api.loadSettings();if(s)S.settings={...S.settings,...s};
    await enter();
    if(S.authNotice&&history.replaceState)history.replaceState(null,'',location.pathname);
  }catch(e){console.error(e);$('#app').innerHTML=`<div class="loading"><b>Aplikasi tidak dapat dibuka.</b><br>${esc(friendly(e))}</div>`;}
})();
</script>
</body>
</html>
